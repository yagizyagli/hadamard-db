name: Hadamard-DB Language Bindings CI

on:
  push:
    branches: [ "main", "stable" ]
    paths:
      - 'bindings/**'
      - 'core/**'
      - '.github/workflows/ci-bindings.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'bindings/**'
      - 'core/**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  python-bindings-test:
    name: Python Bindings Matrix Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set Up Python ${{ matrix.python-version }} Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Inject High-Performance Cargo Compilation Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "bindings/python -> target"

      - name: Install Maturin and Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest

      - name: Compile and Install Native Python Extension (Maturin)
        run: |
          cd bindings/python
          maturin develop

      - name: Execute End-to-End In-Database QML & Grover Python Tests
        run: |
          python -m pytest examples/python_grover_search.py -v --capture=no

  typescript-bindings-test:
    name: TypeScript & Node.js Matrix Validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
       steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain Natively
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Force Rust and Cargo to Global Environment Paths
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustc --version
          cargo --version

      - name: Set Up Node.js ${{ matrix.node-version }} Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: bindings/typescript/package.json

      - name: Inject High-Performance Cargo Compilation Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "bindings/typescript -> target"

      - name: Install Node Ecosystem Module Dependencies
        run: |
          cd bindings/typescript
          npm install

      - name: Execute Native Neon-CLI Build and TypeScript Compilation
        run: |
          cd bindings/typescript
          npm run build

      - name: Validate Type Definition Mapping & Runtime Allocation
        run: |
          cd bindings/typescript
          npx tsc --noEmit
